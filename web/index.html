<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Senior Flutter Developer in Cairo. Five-plus years shipping Flutter to production — BNPL and financial super-apps, plus the internal SDKs their teams build on.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Yasser">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!--
    Favicon. flutter_launcher_icons emits favicon.png at 16x16, so the 192 is
    offered alongside it for high-DPI tabs and bookmarks. Bump the ?v= on every
    icon change — browsers cache favicons well past a hard refresh.
  -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>

  <title>Ahmed Yasser — Senior Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Painted before Flutter boots, so the gap between first paint and first
    frame is the page's own background rather than a white flash. Follows the
    OS setting; a visitor who has overridden it in-page may see this for the
    fraction of a second before their stored choice is restored.
  -->
  <meta name="theme-color" content="#E7E7E2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161A" media="(prefers-color-scheme: dark)">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #E7E7E2;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #16161A; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
